[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "aind-behavior-curriculum"
description = "A framework for defining and evaluating mouse training curricula."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Jonathan Wong", email = "jonathan.wong@alleninstitute.org" },
    { name = "Bruno Cruz", email = "bruno.cruz@alleninstitute.org" },
]

version = "0.0.42"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
readme = { file = "README.md", content-type = "text/markdown" }

dependencies = ["pydantic>=2.14.3", "semver >= 3.0", "jinja2 >= 3.1.3"]

[project.urls]
Documentation = "https://allenneuraldynamics.github.io/aind-behavior-curriculum/"
Repository = "https://github.com/AllenNeuralDynamics/aind-behavior-curriculum/"
Issues = "https://github.com/AllenNeuralDynamics/aind-behavior-curriculum/issues"
Changelog = "https://github.com/AllenNeuralDynamics/aind-behavior-curriculum/releases"

[dependency-groups]
dev = ["ruff", "codespell", "coverage", "interrogate", "pytest", "pytest-cov"]
docs = ["zensical", "mkdocstrings[python]"]

[tool.uv.build-backend]
module-name = "aind_behavior_curriculum"


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I"]
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "google" }

[tool.codespell]
skip = ".git,*.pdf,*.svg,uv.lock,./site,./build,./htmlcov"

ignore-words-list = "nd, assertIn"

[tool.coverage.run]
omit = ["*__init__*"]
source = ["aind_behavior_curriculum", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "from",
    "import",
    "pragma: no cover",
]
fail_under = 88

[tool.interrogate]
exclude = ["setup.py", "docs", "build", "tests/", "examples/"]
fail-under = 100

[tool.uv]
default-groups = ['dev']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
