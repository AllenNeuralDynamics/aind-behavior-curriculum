[project]
site_name = "aind-behavior-curriculum"
site_description = "A framework for defining and evaluating mouse training curricula."
site_author = "Allen Institute for Neural Dynamics"
site_url = "https://allenneuraldynamics.github.io/aind-behavior-curriculum/"
copyright = "Copyright &copy; Allen Institute for Neural Dynamics"
repo_url = "https://github.com/AllenNeuralDynamics/aind-behavior-curriculum"
repo_name = "GitHub"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "intro.md" },
  { "Concepts" = [
    { "Curricula and stages" = "concepts/curriculum.md" },
    { "Policies" = "concepts/policies.md" },
    { "Trainer" = "concepts/trainer.md" },
  ] },
  { "Guides" = [
    { "Building a curriculum" = "guides/building.md" },
    { "Metrics" = "guides/metrics.md" },
    { "Trainer and persistence" = "guides/trainer.md" },
  ] },
  { "Examples" = "examples/index.md" },
  { "API Reference" = [
    { "base" = "api/base.md" },
    { "curriculum" = "api/curriculum.md" },
    { "curriculum_utils" = "api/curriculum_utils.md" },
    { "task" = "api/task.md" },
    { "trainer" = "api/trainer.md" },
  ] },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "favicon.ico"
features = [
  "content.code.copy",
  "content.tabs.link",
  "content.tabs.link",
  "navigation.instant",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
show_source = true
separate_signature = true
show_signature_annotations = true
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.def_list]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
[project.markdown_extensions.toc]
permalink = true
